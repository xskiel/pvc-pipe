<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>May I Court You? 💘</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top left, #ffe0ec, #fff5f8);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      overflow-x: hidden;
      text-align: center;
      position: relative;
    }
    h1 {
      font-size: 2.8rem;
      color: #d6336c;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .message {
      margin-top: 20px;
      max-width: 90%;
      padding: 20px;
      background-color: #fff0f5;
      border-radius: 16px;
      color: #444;
      font-size: 1rem;
      text-align: left;
      white-space: pre-wrap;
      line-height: 1.6;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .message-intro {
      font-size: 1.2rem;
      margin: 20px;
      max-width: 600px;
      color: #444;
      background: #ffffffcc;
      padding: 10px 20px;
      border-radius: 12px;
      animation: typing 3s steps(40, end), blink .75s step-end infinite;
      overflow: hidden;
      white-space: nowrap;
      border-right: 3px solid #d6336c;
    }
    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }
    @keyframes blink {
      50% { border-color: transparent }
    }
    #buttons {
      margin-top: 40px;
    }
    button {
      padding: 15px 30px;
      font-size: 1.1rem;
      border: none;
      border-radius: 30px;
      margin: 10px;
      cursor: pointer;
      transition: 0.3s ease;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
    }
    #yesBtn {
      background-color: #ff6f91;
      color: white;
      animation: bounce 1.5s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    #noBtn {
      background-color: #fce4ec;
      color: #8e24aa;
      position: absolute;
    }
    .heart {
      position: absolute;
      top: -10px;
      width: 20px;
      height: 20px;
      background: pink;
      transform: rotate(45deg);
      animation: fall 5s linear infinite;
      z-index: 0;
    }
    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background: pink;
      border-radius: 50%;
    }
    .heart::before {
      top: -10px;
      left: 0;
    }
    .heart::after {
      top: 0;
      left: -10px;
    }
    @keyframes fall {
      0% { transform: translateY(-10px) rotate(45deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(45deg); opacity: 0; }
    }
    #letterBtn, #surpriseBtn {
      margin-top: 20px;
      background: #ffd6e0;
      color: #8c2f39;
    }
    footer {
      position: relative;
      bottom: 10px;
      font-size: 0.9rem;
      color: #888;
    }
    #surpriseMsg {
      display: none;
      font-size: 1.5rem;
      color: #d6336c;
      background-color: #fff0f5;
      padding: 15px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <audio autoplay loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8b19c9f450.mp3?filename=romantic-love-110104.mp3" type="audio/mp3">
    Your browser does not support the audio element.
  </audio>

  <div class="message">
    <strong>Hello Paula,</strong><br><br>
    [Same long sweet letter you already wrote — keep that here]
  </div>

  <h1>Can I Court You? 🥺👉👈</h1>
  <p class="message-intro">I made this page just for you. I could’ve just said it in chat, but where’s the fun in that?</p>

  <div id="buttons">
    <button id="yesBtn">Yes, you may ❤️</button>
    <button id="noBtn">No, you may not 😅</button>
  </div>

  <button id="letterBtn">Read my heart 💌</button>
  <button id="surpriseBtn">Click for a sweet surprise 🍭</button>
  <div id="surpriseMsg">You’re even more beautiful when you smile 😍</div>

  <footer>Hand-coded with love &lt;3</footer>

  <script>
    const noBtn = document.getElementById('noBtn');
    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    });

    document.getElementById('yesBtn').addEventListener('click', () => {
      confetti();
      alert("YESSSS!!! 😭 Thank you! You just made my whole month!");
    });

    document.getElementById('letterBtn').addEventListener('click', () => {
      const win = window.open('', '_blank', 'width=400,height=500');
      win.document.write(`
        <h2 style='color:#d6336c;'>Dear Crush 💖,</h2>
        <p style='font-family: sans-serif;'>
        You light up my days like the sun peeking after a rainy afternoon.
        I admire not only your beauty but your kindness, your humor, and that spark in your eyes.
        Getting the chance to know you more, to make you smile on purpose — that would mean the world to me.<br><br>
        This page is silly, but my intentions are real.
        Would you let me make you feel special — every single day?
        </p>
        <p style='text-align:right; margin-top:30px;'>— Your hopeful coder 💻💘</p>
      `);
    });

    document.getElementById('surpriseBtn').addEventListener('click', () => {
      const msg = document.getElementById('surpriseMsg');
      msg.style.display = 'block';
      msg.style.animation = 'pulse 1s ease';
    });

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.style.left = Math.random() * window.innerWidth + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }
    setInterval(createHeart, 250);

    function confetti() {
      for (let i = 0; i < 100; i++) {
        const conf = document.createElement('div');
        conf.style.width = '10px';
        conf.style.height = '10px';
        conf.style.background = `hsl(${Math.random()*360}, 100%, 70%)`;
        conf.style.position = 'absolute';
        conf.style.left = Math.random()*100 + '%';
        conf.style.top = '-20px';
        conf.style.opacity = 1;
        conf.style.transition = 'top 2s ease, opacity 2s';
        conf.style.borderRadius = '50%';
        document.body.appendChild(conf);
        setTimeout(() => {
          conf.style.top = Math.random()*100 + '%';
          conf.style.opacity = 0;
        }, 100);
        setTimeout(() => conf.remove(), 2100);
      }
    }
  </script>
</body>
</html>
